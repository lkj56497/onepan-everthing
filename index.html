<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="원팬요리의 모든것">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141918" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>원팬요리의 모든것</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 화면 앱 — 위에 냉장고(재료 칩), 아래에 요리 가능한 레시피 목록, 탭하면 전체화면 레시피 */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --fg:#1B2220; --muted:#5E6B67; --line:#D6DDDA;
  --yolk:#F2B705; --yolk-ink:#2A2100; --pepper:#C2361F; --leaf:#2E7D4F; --chip:#E3E8E6;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141918; --surface:#1E2523; --fg:#ECF0EE; --muted:#9AA6A2; --line:#2F3936;
  --yolk:#F5C02A; --yolk-ink:#231B00; --pepper:#F0735C; --leaf:#5CC28A; --chip:#27302E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141918; --surface:#1E2523; --fg:#ECF0EE; --muted:#9AA6A2; --line:#2F3936;
  --yolk:#F5C02A; --yolk-ink:#231B00; --pepper:#F0735C; --leaf:#5CC28A; --chip:#27302E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;letter-spacing:-.5px}
h1 .pan{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--fg);position:relative;margin-right:.12em;vertical-align:-.02em}
h1 .pan::after{content:"";position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:var(--yolk)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.sub a{color:inherit}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
section{margin-top:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:stretch;margin-bottom:12px}
.tools input,.tools .ghost{height:44px;margin:0;box-sizing:border-box}
.tools .ghost{display:flex;align-items:center;justify-content:center;padding:0 12px;white-space:nowrap}
input[type=search]{width:100%;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.groups{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.group{min-width:0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.group summary::-webkit-details-marker{display:none}
.group summary::after{content:"";margin-left:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);flex:none}
.group[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.group .gname{flex:1;min-width:0}
.group .gcount{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.group .gcount.on{color:var(--yolk-ink);background:var(--yolk);border-radius:999px;padding:1px 8px;font-weight:700}
.group .gsel{display:block;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group .chips{padding:0 14px 14px}
@media (prefers-reduced-motion:no-preference){.group summary::after{transition:transform .15s}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--yolk);color:var(--yolk-ink);font-weight:600}
.chip .n{font-size:11px;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
[hidden]{display:none!important}.mq{margin:0 0 10px}.mqinfo{margin:-2px 0 10px;font-size:13px;color:var(--muted,#6b7570)}
.kinds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:-4px 0 12px;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.kind{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.3}
.kind[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.kind .n{font-size:11px;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.kt{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:2px;line-height:1.5}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg .c{margin-left:3px;font-variant-numeric:tabular-nums;margin-left:4px}
.list{display:grid;gap:8px}
.cw{position:relative}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--chip);flex:none}
.thumb img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{position:absolute;inset:8px;width:48px;height:48px}
.badge{position:absolute;right:3px;bottom:3px;font-size:11px;font-weight:700;line-height:1;padding:3px 5px;border-radius:6px;color:#fff;font-variant-numeric:tabular-nums;z-index:1}
.ill{color:var(--muted)}.ill .a{fill:var(--yolk)}.ill .b{fill:var(--surface)}
.hero{position:relative;margin:4px 0 10px;border-radius:16px;overflow:hidden;background:var(--chip);aspect-ratio:16/10}
.hero.noimg{aspect-ratio:auto;height:120px}
.hero svg{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%)}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:1}
.ing li .nm{min-width:0}
.pb{margin-left:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;font-size:12px;padding:1px 8px;vertical-align:1px}
.pb[aria-expanded=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pl{grid-column:1/-1;margin:2px 0 2px;font-size:13.5px;line-height:1.55;color:var(--fg);background:var(--bg);border-radius:8px;padding:8px 10px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.pq{margin:10px 0 12px}
.ingh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ingh .h3{margin-bottom:8px}
.mtog{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;margin-bottom:8px}
.mtog button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.mtog button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.pg summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.pg summary::after{content:"+";color:var(--muted)}.pg[open] summary::after{content:"−"}
.pg p{margin:0;padding:0 14px 12px;font-size:14px;line-height:1.6}
.pgh{font-size:13px;color:var(--muted);margin:16px 2px 6px;font-weight:600}
.foot{text-align:center;margin:28px 0 8px}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}
.cred{list-style:none;margin:10px 0 0;padding:0;font-size:13px;line-height:1.5}
.cred li{padding:9px 0;border-top:1px solid var(--line)}.cred b{display:block;font-size:14px}.cred a{color:var(--muted)}
.cw .card{padding-right:52px}
.star{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--yolk)}
.star:hover{background:var(--chip)}
.dth{display:flex;align-items:flex-start;gap:8px}
.dth .dt{flex:1;min-width:0}
.star.big{position:static;flex:none;width:46px;height:46px;font-size:28px;margin-top:6px;background:var(--surface);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.card{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:conic-gradient(var(--ringc) calc(var(--p)*1%),var(--chip) 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.card .t{font-weight:700;font-size:16px;line-height:1.3}
.card .meta{font-size:13px;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.miss span{font-size:12px;border:1px dashed var(--pepper);color:var(--pepper);border-radius:999px;padding:1px 8px}
.ok{color:var(--leaf);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .txt{flex:1;min-width:0;font-size:14px}
.bar b{font-variant-numeric:tabular-nums}
.primary{border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
/* detail */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{padding-top:12px}
.back{border:0;background:transparent;padding:8px 0;font-size:15px;color:var(--muted)}
.dt{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.note{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yolk);border-radius:10px;padding:10px 12px;font-size:14px}
.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ing li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing .amt{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:14px}
.ing .mk{font-size:13px;font-weight:700}
.ing .have .mk{color:var(--leaf)} .ing .need .mk{color:var(--pepper)} .ing .need .nm{color:var(--pepper)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s}
.std{display:inline-block;font-size:11px;font-weight:600;color:var(--yolk-ink);background:var(--yolk);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.tip{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.tip b{background:var(--yolk);color:var(--yolk-ink);border-radius:6px;padding:1px 7px;font-size:12px;margin-top:2px}
.tip + .note{margin-top:8px}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.tm{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--chip);border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:start;margin-top:3px}
.steps button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.steps button::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps button[aria-pressed="true"]{opacity:.5}
.steps button[aria-pressed="true"] span{text-decoration:line-through}
.steps button[aria-pressed="true"]::before{background:var(--leaf);content:"✓"}
.h3{font-size:13px;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:22px 0 8px}
.src{display:inline-block;margin-top:18px;color:var(--fg);font-weight:600}
.small{font-size:12px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:no-preference){.chip,.seg button{transition:background .15s}}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
header{display:block}
.htop h1{min-width:0}
.lang{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:10px}
.lang button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.ing small{font-size:12px;color:var(--muted);font-weight:400}
:root:lang(ja){--display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Black Han Sans",sans-serif;--body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","IBM Plex Sans KR",system-ui,sans-serif}
:root:lang(ja) .dt,:root:lang(ja) h2{font-weight:800}
.hbtns{display:flex;gap:6px}
.whohead{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.linkbtn.sm{padding:4px 2px;font-size:12px}
.who{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.wb{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;border:0;background:transparent;padding:0;color:var(--fg)}
.wb .av{width:52px;height:52px;font-size:20px;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line)}
.wb[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--yolk)}
.wb .wn{font-size:12px;line-height:1.2;text-align:center;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb[aria-pressed="true"] .wn{font-weight:700}
.wb .wc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.av{display:grid;place-items:center;border-radius:50%;background:var(--avc,var(--chip));color:#fff;font-family:var(--display);flex:none}
.av.all{background:var(--fg);color:var(--bg);font-size:13px!important;font-family:var(--body);font-weight:700}
.av.unk{background:var(--chip);color:var(--muted)}
.ctag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--fg);margin-top:3px;max-width:100%}
.ctag .av{width:18px;height:18px;font-size:10px}
.ctag.unk{color:var(--muted);font-weight:500}
.ostrip{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px}
.ostrip h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px}
.ostrip p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.ostrip .lead{color:var(--fg);font-size:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pepper);border-radius:10px;padding:10px 12px}
.crbox{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 4px}
.crbox .av{width:48px;height:48px;font-size:20px}
.crbox .cn{font-weight:700;font-size:16px;line-height:1.25}
.crbox .cd{font-size:13px;color:var(--muted);line-height:1.4}
.crbox .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chbtn.sec{background:var(--chip);color:var(--fg)}
.chbtn svg{width:16px;height:16px}
.crlist{display:grid;gap:10px;margin-top:12px}
.crlist .crbox{margin:0}
.unkbox{background:transparent;border-style:dashed}
.sim{display:grid;gap:8px}
.fnote{font-size:12px;color:var(--muted);margin:0 auto 6px;max-width:520px;line-height:1.5}
.card .meta{display:block}
.soon{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.soon b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
</style>

<div class="wrap">
  <header>
    <div class="htop">
      <h1><span class="pan" aria-hidden="true"></span>원팬요리의 모든것</h1>
      <div class="hbtns"><button type="button" class="hbtn" id="crbtn">인플루언서</button><button type="button" class="hbtn" id="prepbtn">재료 손질법</button></div>
    </div>
    <p class="sub" id="sub"></p>
  </header>

  <section id="fridge" aria-labelledby="fh">
    <div class="sechead"><h2 id="fh"></h2><span class="hint" id="selcount"></span></div>
    <div class="tools">
      <input type="search" id="q">
      <button class="ghost" id="clear" type="button"></button>
      <button class="ghost" id="basic" type="button"></button>
    </div>
    <div id="groups" class="groups"></div>
  </section>

const PREP = {"우삼겹": "냉동이면 냉장실에서 해동하거나 그대로 팬에 올려 풀어가며 익혀요. 키친타월로 겉 물기와 핏물을 살짝 눌러 닦아주세요.", "돼지고기": "키친타월로 핏물을 닦고, 두꺼운 비계나 힘줄은 잘라내요. 볶음용은 한입 크기로 썰고, 잡내가 걱정되면 맛술이나 청주를 조금 뿌려 10분 재워두세요.", "닭다리살": "두꺼운 노란 기름 덩어리와 힘줄을 가위로 잘라내요. 두꺼운 부분은 칼집을 내 두께를 맞추면 고르게 익어요. 우유나 맛술에 10분 재우면 잡내가 빠져요.", "닭가슴살": "가운데 하얀 힘줄을 칼등으로 누르며 당겨 빼요. 두꺼우면 반으로 저며 두께를 맞추고, 포크로 몇 군데 찔러두면 양념이 잘 배요.", "등갈비": "찬물에 30분~1시간 담가 핏물을 빼요. 중간에 물을 한두 번 갈아주세요. 끓는 물에 5분 데쳐 헹구면 잡내와 기름이 빠져요.", "아롱사태": "찬물에 30분 담가 핏물을 빼요. 겉의 질긴 막은 그대로 두면 익으면서 쫄깃해져요. 덩어리째 삶고 다 익은 뒤 얇게 썰어요.", "육회용 소고기": "핏물을 키친타월로 꾹꾹 눌러 닦고, 결 반대 방향으로 가늘게 채 썰어요. 반쯤 얼린 상태에서 썰면 훨씬 쉬워요. 먹기 직전까지 차갑게 두세요.", "베이컨": "원하는 폭으로 가위로 잘라 쓰면 돼요. 기름이 많으면 먼저 구워 나온 기름을 덜어내세요.", "소시지": "칼집을 어슷하게 내면 양념이 잘 배고 터지지 않아요. 짠맛이 걱정되면 끓는 물에 1분 데쳐 쓰세요.", "스팸": "캔에서 꺼내 원하는 두께로 썰어요. 짠맛과 기름을 줄이려면 끓는 물에 살짝 데치거나 뜨거운 물을 부었다 버리세요.", "삼겹살": "키친타월로 겉 물기를 닦고 먹기 좋은 크기로 잘라요. 덩어리 통삼겹은 찬물에 20분 담가 핏물을 빼고 쓰세요.", "소고기": "키친타월로 핏물을 꾹꾹 눌러 닦아요. 불고기용은 결 반대로 썰고, 양념에 30분 이상 재워두면 부드러워요.", "닭(한 마리)": "흐르는 물에 씻으며 배 속 핏덩이와 꼬리 쪽 기름(미추)을 떼어내요. 날개 끝과 두꺼운 껍질 기름도 잘라내고, 끓는 물에 한 번 데쳐 헹구면 국물이 맑아요.", "훈제오리": "이미 익힌 제품이라 데우기만 하면 돼요. 기름이 많으면 끓는 물을 부었다 버리거나 마른 팬에 구워 기름을 빼세요.", "햄": "원하는 모양으로 썰어 쓰면 돼요. 짠맛이 강하면 끓는 물에 살짝 데쳐 쓰세요.", "닭똥집": "겉의 하얗고 질긴 막과 노란 부분을 칼로 저며 떼어내요. 굵은 소금이나 밀가루로 주물러 씻은 뒤 헹구면 잡내가 빠져요. 칼집을 내면 빨리 익어요.", "새우": "머리를 떼고 껍질을 벗긴 뒤, 등 쪽 두 번째 마디에 이쑤시개를 넣어 검은 내장을 빼요. 꼬리 끝 물주머니를 잘라내면 기름이 덜 튀어요. 냉동은 찬 소금물에 담가 해동하세요.", "명란젓": "칼로 껍질에 길게 칼집을 내고 칼등으로 알만 긁어내요. 덩어리째 쓸 때는 그대로 썰면 돼요.", "곤이": "찬 소금물에 살살 흔들어 씻고 붙어 있는 핏줄과 막을 떼어내요. 너무 세게 씻으면 터지니 조심하세요.", "오징어": "몸통 안으로 손을 넣어 내장과 투명한 뼈를 빼고, 다리 사이 입과 눈을 잘라내요. 밀가루나 굵은 소금으로 문질러 씻으면 미끈한 점액이 빠져요. 안쪽에 격자 칼집을 내면 말리지 않고 양념이 잘 배요.", "쭈꾸미": "머리를 뒤집어 먹물과 내장을 떼고, 다리 사이 입과 눈을 잘라내요. 밀가루를 듬뿍 넣고 바락바락 주물러 씻은 뒤 여러 번 헹궈요.", "고등어": "배를 갈라 내장과 검은 막을 긁어내고 깨끗이 씻어요. 쌀뜨물이나 우유에 10분 담그면 비린내가 줄어요. 순살은 키친타월로 물기만 닦으면 돼요.", "참치캔": "체에 밭쳐 기름을 빼고 써요. 기름을 꾹 짜면 담백하고, 살짝만 빼면 고소해요.", "황태채": "물에 10초만 담갔다가 꼭 짜서 부드럽게 만들어요. 가시가 있으면 골라내고 먹기 좋게 찢어요.", "어묵": "끓는 물을 끼얹거나 살짝 데치면 기름과 첨가물 냄새가 빠져요. 먹기 좋은 크기로 썰어 쓰세요.", "맛살": "비닐을 벗기고 결대로 찢거나 썰어요.", "미역": "마른 미역은 찬물에 10~20분 불리면 양이 10배쯤 늘어나요. 바락바락 주물러 여러 번 헹구고 물기를 짠 뒤 먹기 좋게 잘라요.", "골뱅이": "캔 국물은 따라내고 흐르는 물에 헹궈요. 큰 것은 반으로 잘라 쓰세요.", "가리비": "솔로 껍데기를 닦고 소금물에 30분 담가 해감해요. 껍데기 사이로 칼을 넣어 관자를 떼고, 검은 내장 주머니는 떼어내요.", "바지락": "소금물(물 1리터에 소금 2큰술)에 담그고 검은 봉지나 뚜껑을 덮어 어두운 곳에 1~2시간 둬요. 해감 후 껍데기끼리 비비며 씻어요. 입이 벌어진 채 닫히지 않는 것은 버리세요.", "갈치": "칼등으로 은빛 비늘을 살살 긁어내고 지느러미를 가위로 잘라요. 내장을 빼고 씻은 뒤 물기를 닦고 굽기 전에 소금을 살짝 뿌려두세요.", "전복": "솔로 살과 껍데기를 깨끗이 문질러 닦아요. 숟가락을 껍데기와 살 사이에 넣어 떼어내고, 입 쪽 단단한 이빨을 잘라내요. 내장은 터지지 않게 떼어 따로 써요.", "자숙문어": "이미 삶은 문어라 흐르는 물에 헹군 뒤 먹기 좋게 썰기만 하면 돼요. 오래 익히면 질겨지니 마지막에 넣으세요.", "연어": "키친타월로 물기를 닦고, 남은 가시는 손가락으로 더듬어 핀셋으로 뽑아요. 소금을 살짝 뿌려 10분 두면 비린 물이 빠져요.", "냉동 해물믹스": "찬 소금물에 담가 해동한 뒤 물기를 빼요. 끓는 물에 살짝 데쳐 쓰면 비린내가 줄어요.", "파": "뿌리를 자르고 흐르는 물에 흙을 씻어요. 흰 부분은 향을 낼 때, 초록 부분은 마지막 고명으로 쓰면 좋아요.", "양파": "위아래를 자르고 껍질을 벗겨요. 썰 때 눈이 매우면 냉장고에 30분 넣어뒀다가 썰거나 칼에 물을 묻히세요.", "마늘": "꼭지를 자르고 칼 옆면으로 눌러 으깨면 껍질이 쉽게 벗겨져요. 다질 때는 으깬 뒤 다지면 빨라요.", "청양고추": "꼭지를 떼고 썰어요. 덜 맵게 하려면 반을 갈라 씨를 털어내세요. 만진 손으로 눈을 비비지 마세요.", "감자": "껍질을 벗기고 싹이 난 부분이나 초록색 부분은 꼭 도려내요. 썬 뒤 찬물에 담가 전분을 빼면 덜 달라붙고 색도 안 변해요.", "버섯": "물에 씻으면 향이 빠지니 키친타월로 흙만 닦아요. 밑동을 잘라내고, 팽이·만가닥버섯은 가닥을 나누고, 표고는 기둥을 떼어 따로 써요.", "콩나물": "물에 담가 흔들어 껍질을 걸러내고 헹궈요. 상한 꼬리만 떼면 되고 꼬리를 다 다듬지 않아도 돼요. 익힐 때 뚜껑을 처음부터 덮거나 아예 열어두면 비린내가 안 나요.", "숙주": "찬물에 담가 껍질을 걸러내고 헹군 뒤 체에 밭쳐 물기를 빼요. 금방 숨이 죽으니 마지막에 넣으세요.", "깻잎": "한 장씩 흐르는 물에 앞뒤로 씻어요. 꼭지를 자르고 물기를 털어 쓰세요.", "양배추": "겉잎 한두 장을 떼고 반으로 갈라 심을 V자로 도려내요. 썬 뒤 찬물에 담갔다 건지면 아삭해요.", "당근": "껍질을 필러로 벗기고 위아래를 잘라요. 단단해서 익는 데 오래 걸리니 다른 채소보다 작게 썰거나 먼저 넣으세요.", "무": "껍질을 필러로 벗겨요. 윗부분(초록)은 달아서 생채나 무침, 아랫부분은 매워서 국·조림에 좋아요.", "애호박": "꼭지를 자르고 씻어요. 껍질째 쓰고, 볶음이나 전은 소금을 살짝 뿌려 5분 두었다 물기를 닦으면 덜 물러져요.", "배추": "밑동을 자르고 한 장씩 떼어 사이사이 흙을 씻어요. 두꺼운 줄기와 잎을 따로 썰어 줄기를 먼저 익히세요.", "청경채": "밑동을 살짝 잘라 잎을 떼거나 반으로 갈라요. 밑동 사이에 흙이 많으니 물에 담가 흔들어 씻으세요.", "오이": "굵은 소금으로 겉을 문질러 씻으면 가시와 쓴맛이 빠져요. 양 끝 꼭지를 잘라내요.", "부추": "누런 잎과 뿌리 끝을 떼고 흐르는 물에 씻어요. 숨이 빨리 죽으니 마지막에 넣고 바로 불을 끄세요.", "미나리": "잎과 줄기 사이의 누런 잎을 떼고, 식초를 한두 방울 떨어뜨린 물에 5분 담갔다 헹궈요.", "시래기": "말린 시래기는 하룻밤 물에 불리고 30분 이상 삶은 뒤 그대로 식혀요. 질긴 겉껍질을 벗기고 헹궈 물기를 짜요.", "우엉": "칼등으로 껍질을 살살 긁어 벗겨요. 썬 뒤 바로 식초물에 담가두면 색이 변하지 않고 떫은맛이 빠져요.", "생강": "숟가락 끝으로 긁으면 껍질이 쉽게 벗겨져요. 얇게 저미거나 다져 쓰세요.", "김치": "찌개나 볶음에는 잘 익은 김치가 좋아요. 가위로 먹기 좋게 자르고, 너무 시면 설탕을 조금 넣어 균형을 맞추세요.", "토마토": "꼭지를 떼고 썰어요. 껍질을 벗기려면 꼭지 반대편에 십자 칼집을 내 끓는 물에 20초 담갔다가 찬물에 넣어 벗기세요.", "시금치": "뿌리 끝을 자르고 굵은 것은 뿌리 쪽에 십자로 칼집을 내요. 물에 담가 흔들어 흙을 빼고, 데칠 땐 소금 넣은 끓는 물에 30초만 데쳐 찬물에 헹궈요.", "상추": "한 장씩 흐르는 물에 씻고 물기를 털어요. 찬물에 잠깐 담가두면 아삭해져요.", "양상추": "심을 손으로 눌러 빼고 손으로 뜯어요. 칼로 썰면 단면이 갈색으로 변해요. 찬물에 담갔다 물기를 빼면 아삭해요.", "루꼴라": "찬물에 담가 흔들어 씻고 물기를 털어요. 질긴 줄기 끝만 잘라내면 돼요.", "쑥갓": "억센 줄기 끝을 자르고 씻어요. 향이 날아가니 마지막에 넣어 숨만 죽이세요.", "꽈리고추": "꼭지를 떼고 포크로 몇 군데 찔러두면 양념이 배고 터지지 않아요.", "마늘쫑": "끝의 질긴 부분과 꽃봉오리를 잘라내고 먹기 좋은 길이로 썰어요. 매운맛이 강하면 끓는 물에 살짝 데쳐요.", "파프리카": "반으로 갈라 꼭지와 씨, 하얀 심지를 떼어내고 썰어요.", "아보카도": "세로로 칼집을 한 바퀴 내고 비틀어 반으로 나눠요. 씨에 칼날을 콕 박아 비틀어 빼고, 숟가락으로 과육을 떠내요. 갈변 막으려면 레몬즙을 살짝 뿌리세요.", "고구마": "솔로 흙을 씻고 필요하면 껍질을 벗겨요. 썬 뒤 물에 담가 전분을 빼면 덜 끈적이고 색이 안 변해요.", "단호박": "통째로 전자레인지에 2~3분 돌리면 말랑해져 자르기 쉬워요. 반으로 갈라 숟가락으로 씨를 긁어내요.", "밤": "물에 30분 불린 뒤 겉껍질을 벗기고 속껍질을 칼로 긁어내요. 삶은 밤은 반으로 잘라 숟가락으로 파내도 돼요.", "대추": "물에 씻어 칼집을 내거나 돌려깎기해서 씨를 빼요.", "냉동 채소": "해동하지 말고 바로 넣어요. 물기가 생기니 센불에서 볶으세요.", "가지": "꼭지를 떼고 썰어요. 소금을 살짝 뿌려 5~10분 두었다가 물기를 닦으면 기름을 덜 먹고 덜 물러져요. 썰고 바로 안 쓰면 물에 담가 갈변을 막으세요.", "피망": "반으로 갈라 꼭지와 씨를 떼고 썰어요. 통째로 구울 때는 씨째 써도 먹을 수 있어요.", "브로콜리": "송이를 작게 나누고 굵은 줄기는 껍질을 벗겨 썰어요. 식초물이나 소금물에 10분 담가 송이 사이 이물질을 빼요.", "아스파라거스": "아래쪽 단단한 끝을 손으로 구부리면 자연스럽게 꺾이는 곳에서 잘라요. 아래쪽 껍질이 질기면 필러로 얇게 벗기세요.", "연근": "필러로 껍질을 벗기고 썬 뒤 바로 식초물에 10분 담가요. 갈변을 막고 아삭한 식감이 살아요.", "오크라": "꼭지 끝을 살짝 잘라내고, 소금으로 문질러 솜털을 없앤 뒤 헹궈요.", "마(산마)": "껍질을 필러로 벗겨요. 미끈한 점액에 손이 가려울 수 있으니 장갑을 끼거나 식초물로 손을 헹구세요.", "곤약": "끓는 물에 2~3분 데치면 특유의 냄새가 빠져요. 젓가락으로 찔러 구멍을 내거나 손으로 뜯으면 양념이 잘 배요.", "파슬리": "찬물에 씻어 물기를 완전히 빼고 잎만 떼어 다져요.", "계란": "요리 전에 실온에 30분 두면 고르게 익어요. 깨기 전에 껍데기를 씻지 말고, 깬 뒤 껍질 조각이 들어가면 껍질로 떠내세요.", "메추리알": "삶은 뒤 찬물에 담가 식히고, 통에 물과 함께 넣고 흔들면 껍질이 쉽게 벗겨져요.", "두부": "키친타월로 감싸 무거운 접시를 올려 10분 두면 물기가 빠져 부서지지 않아요. 찌개용은 물기를 빼지 않아도 돼요.", "순두부": "봉지 가운데를 반으로 잘라 그대로 짜 넣으면 모양이 덜 부서져요.", "두부면": "흐르는 물에 한 번 헹궈 물기를 빼면 콩 비린내가 줄어요.", "카망베르 치즈": "차가울 때 썰어야 깔끔하게 잘려요. 겉의 하얀 껍질도 먹을 수 있어요.", "쌀": "물을 붓고 처음 물은 바로 버린 뒤, 손으로 살살 저어가며 물이 맑아질 때까지 3~4번 씻어요. 30분 불리면 밥이 고르게 익어요.", "파스타면": "물 1리터에 소금 1큰술을 넣고 봉지 표기 시간보다 1분 짧게 삶아요. 원팬 요리는 팬에서 소스와 함께 끓이니 따로 삶지 않아도 돼요.", "당면": "찬물에 30분 이상 불리면 빨리 익어요. 너무 길면 가위로 잘라 쓰세요.", "떡": "굳은 떡은 물에 10~20분 담그거나 끓는 물에 살짝 데쳐 말랑하게 해요. 떡끼리 붙어 있으면 하나씩 떼어주세요.", "냉동 중화면": "끓는 물에 넣어 풀어지면 바로 건지거나, 국물에 그대로 넣어 끓여요.", "냉면": "면을 손으로 비벼 풀고 끓는 물에 40초 정도 삶아 찬물에 여러 번 비벼 헹궈 전분을 빼요.", "소면": "끓는 물에 펼쳐 넣고 넘치려 하면 찬물을 반 컵씩 부어요. 다 삶으면 찬물에 바락바락 비벼 헹궈야 쫄깃해요.", "우동면": "냉동 면은 끓는 물에 1분 데치거나 국물에 그대로 넣어요. 전자레인지에 1~2분 돌려 쓰면 더 쫄깃해요.", "칼국수면": "겉의 덧가루를 털어내거나 찬물에 한 번 헹구면 국물이 탁해지지 않아요.", "쫄면": "면을 손으로 비벼 한 가닥씩 풀고 삶은 뒤 찬물에 여러 번 헹궈요.", "메밀면": "삶은 뒤 찬물에 비벼 헹궈 전분을 충분히 빼야 뚝뚝 끊기지 않아요.", "라이스누들": "찬물에 30분~1시간 불려 부드러워지면 써요. 볶을 때 물을 조금 넣으면 덜 달라붙어요.", "라이스페이퍼": "미지근한 물에 2~3초만 담갔다 빼요. 오래 담그면 찢어지고 들러붙어요.", "오트밀": "그대로 끓여도 되고, 물이나 우유에 10분 불리면 더 부드러워요.", "냉동만두": "해동하지 말고 바로 조리해요. 해동하면 피가 찢어져요.", "만두피": "마르지 않게 젖은 행주나 랩을 덮어두고 한 장씩 꺼내 쓰세요. 가장자리에 물을 발라 붙여요.", "순대": "냉동은 전자레인지나 찜으로 데운 뒤 썰어요. 차가울 때 썰면 덜 부서져요.", "김": "마른 팬에 앞뒤로 살짝 구우면 바삭하고 향이 좋아져요.", "다시마": "겉의 하얀 가루는 감칠맛 성분이니 씻지 말고 젖은 행주로 살짝 닦아요. 찬물에 30분 담가 우린 뒤 끓기 직전에 건져야 끈적이지 않아요.", "블랙올리브": "체에 밭쳐 국물을 빼고 원하는 두께로 썰어요.", "올리브": "체에 밭쳐 국물을 빼고 씨가 있으면 칼로 눌러 빼요.", "우메보시": "씨를 빼고 칼로 다져 페이스트처럼 써요. 짜면 물에 잠깐 담가 염분을 빼세요.", "선드라이 토마토": "기름에 절인 것은 기름째 쓰고, 마른 것은 미지근한 물에 15분 불려 써요.", "땅콩": "마른 팬에 살짝 볶아 굵게 다지면 고소함이 살아나요.", "견과류": "마른 팬에 약불로 2~3분 볶으면 눅눅함이 사라지고 고소해져요.", "호두": "끓는 물에 1분 데쳐 헹구면 떫은맛과 먼지가 빠져요. 마른 팬에 볶아 쓰세요."};
const PH = [];
const PHMAP = {};
const key = n => MAP[n] || n;
R.forEach(r=>{
  r.items = r.i.map(([n,a,f],j)=>{const k=key(n);return {j,n,a,f:!!f,k,skip:SKIP.has(n),opt:OPT.has(k)||/선택|취향껏|생략/.test(a)}});
  r.mins=r.tm.reduce((t,s)=>{const m=s.match(/(\d+)(?:~(\d+))?\s*(분|초)/);if(!m)return t;const v=+(m[2]||m[1]);return t+(m[3]==="초"?v/60:v)},0);
  r.total=r.mins<10?Math.max(1,Math.round(r.mins)):Math.ceil(r.mins/5)*5;
  const seen=new Set(); r.req=[];

function simH(i){
